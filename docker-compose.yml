services:
  nginx:
    image: ${REGISTRY_PREFIX:-}nginx:1.30.3-alpine
    restart: always
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    environment:
      NGINX_ENVSUBST_FILTER_VARIABLES: "CERT_TYPE CERT_DOMAIN"
      CERT_TYPE: ${CERT_TYPE}
      CERT_DOMAIN: ${CERT_DOMAIN}
    volumes:
      # templates/*.template 会由官方镜像的启动脚本 envsubst 后输出到 /etc/nginx/conf.d/
      - ./templates:/etc/nginx/templates:ro
      - ./certs:/etc/nginx/certs:ro
      - ./snippets:/etc/nginx/snippets:ro
      # 静态站点内容（如 sap.zaqbest.com）
      - ./html:/usr/share/nginx/html:ro
    mem_limit: 128m

networks:
  docker-kit-network:
    external: true

